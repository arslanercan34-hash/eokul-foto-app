name: Build Release APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Imzalama anahtari tanimliysa otomatik kullanilir (Settings -> Secrets).
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

  # Tum adimlarin kullandigi tek kaynak (isim tekrarini onler).
  MANIFEST: android/app/src/main/AndroidManifest.xml

jobs:
  build:
    name: Flutter Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # camera 0.10.x / permission_handler 12.x / share_plus 12.x ile uyumlu.
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ---------------------------------------------------------------------
      # 1) Eksik Android iskeletini CI uzerinde uret.
      #
      #    --project-name, pubspec.yaml'daki `name:` ile AYNI olmali; aksi
      #    halde flutter create "name does not match" hatasi verir.
      #
      #    Uretilenler: gradlew, gradle-wrapper.jar, local.properties,
      #    mipmap ikonlari, (varsa eksik) manifest ve activity.
      # ---------------------------------------------------------------------
      - name: Generate Android scaffold
        run: |
          flutter create . \
            --org com.eokul \
            --project-name eokul_fotograf \
            --platforms=android

      # ---------------------------------------------------------------------
      # 2) Elle yazdigimiz kaynaklari geri yukle.
      #
      #    `git checkout -- .` YALNIZCA izlenen (tracked) dosyalari dondurur.
      #    Manifest izlenmiyorsa veya commit'te yoksa Flutter'in sablonu
      #    kalir -> izinler kaybolur. Bu yuzden 3. adimda izinler bagimsiz
      #    olarak garantilenir.
      # ---------------------------------------------------------------------
      - name: Restore hand-written sources
        run: |
          set -e

          git checkout -- . || true

          # Flutter 3.35 `flutter create` Kotlin DSL uretir; Groovy
          # dosyalarimizla cakisir.
          find android -name "*.kts" -delete

          # flutter create'in urettigi fazladan activity paketleri.
          # (Bizim paketimiz: com.eokul.fotograf -- SILINMEMELI.)
          rm -rf android/app/src/main/kotlin/com/eokul/eokul_fotograf
          rm -rf android/app/src/main/java/com/eokul/eokul_fotograf
          rm -rf android/app/src/main/kotlin/com/eokul/eokul_foto_app
          rm -rf android/app/src/main/java/com/eokul/eokul_foto_app

          rm -f test/widget_test.dart
          rm -f lib/main.dart.bak pubspec.yaml.bak

          echo "Geri yukleme tamamlandi."

      # ---------------------------------------------------------------------
      # 3) IZIN ENJEKSIYONU  <-- asil duzeltme
      #
      #    AndroidManifest.xml icinde eksik olan CAMERA / depolama izinleri
      #    ve kamera donanim ozellikleri dogrudan yazilir.
      #
      #    Idempotent: izin zaten varsa TEKRAR EKLENMEZ.
      #    Git durumundan bagimsizdir: manifest ezilmis olsa da calisir.
      # ---------------------------------------------------------------------
      - name: Ensure Android permissions in manifest
        run: |
          # NOT: `set -e` BILEREK kullanilmiyor. Asagidaki `grep -q` cagrilari
          # "bulunamadi" (exit 1) durumunda normal akis parcasidir; set -e
          # acik olsaydi script sessizce olurdu.
          set -u

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST bulunamadi. Scaffold uretimi basarisiz."
            exit 1
          fi

          BLOCK=$(mktemp)
          {
            echo '    <!-- e-Okul Vesikalik: zorunlu izinler (CI tarafindan enjekte edildi) -->'
            grep -q 'android.permission.CAMERA' "$MANIFEST" \
              || echo '    <uses-permission android:name="android.permission.CAMERA" />'
            grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$MANIFEST" \
              || echo '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
            grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' "$MANIFEST" \
              || echo '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />'
            grep -q 'android.permission.READ_MEDIA_IMAGES' "$MANIFEST" \
              || echo '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />'
            echo ''
            grep -q 'android.hardware.camera"' "$MANIFEST" \
              || echo '    <uses-feature android:name="android.hardware.camera" android:required="true" />'
            grep -q 'android.hardware.camera.autofocus' "$MANIFEST" \
              || echo '    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />'
            grep -q 'android.hardware.camera.flash' "$MANIFEST" \
              || echo '    <uses-feature android:name="android.hardware.camera.flash" android:required="false" />'
          } > "$BLOCK"

          if grep -qE '<uses-permission|<uses-feature' "$BLOCK"; then
            awk -v bf="$BLOCK" '
              /<application/ && !done {
                while ((getline l < bf) > 0) print l
                close(bf)
                done = 1
              }
              { print }
            ' "$MANIFEST" > "${MANIFEST}.tmp"

            if [ -s "${MANIFEST}.tmp" ]; then
              mv "${MANIFEST}.tmp" "$MANIFEST"
              echo "Izinler manifest'e eklendi."
            else
              echo "::error::Manifest enjeksiyonu bos dosya uretti."
              rm -f "${MANIFEST}.tmp"
              exit 1
            fi
          else
            echo "Izinler zaten mevcut; degisiklik yapilmadi."
          fi
          rm -f "$BLOCK"

          # Uygulama gorunen adini duzelt (Flutter sablonu proje adini yazar).
          # UTF-8 etiket icin python kullaniliyor; sed yerel ayara takilabilir.
          python3 - "$MANIFEST" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          t = p.read_text(encoding="utf-8")
          t2 = re.sub(r'android:label="[^"]*"', 'android:label="e-Okul Vesikalık"', t, count=1)
          if t2 != t:
              p.write_text(t2, encoding="utf-8")
              print("Manifest etiketi guncellendi.")
          PY

          echo "--- Manifest izin satirlari ---"
          grep -nE 'uses-permission|uses-feature' "$MANIFEST" || true

      # ---------------------------------------------------------------------
      # 4) MainActivity emniyet kemeri.
      #
      #    Git geri yukleme basarisiz olup Flutter'in urettigi activity
      #    silindiyse derleme "class MainActivity not found" ile patlar.
      # ---------------------------------------------------------------------
      - name: Ensure MainActivity
        run: |
          set -e

          ACTIVITY=android/app/src/main/kotlin/com/eokul/fotograf/MainActivity.kt

          if [ ! -f "$ACTIVITY" ]; then
            echo "::warning::$ACTIVITY bulunamadi, yeniden olusturuluyor."
            mkdir -p "$(dirname "$ACTIVITY")"
            printf 'package com.eokul.fotograf\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity : FlutterActivity()\n' > "$ACTIVITY"
          fi

          echo "MainActivity hazir: $ACTIVITY"

      # ---------------------------------------------------------------------
      # 5) Emniyet kemeri: kritik dosyalar gercekten yerinde mi?
      # ---------------------------------------------------------------------
      - name: Verify hand-written sources
        run: |
          set -e

          fail() { echo "::error::$1"; exit 1; }

          [ -f android/gradlew ] \
            || fail "android/gradlew uretilmedi."
          [ -f android/gradle/wrapper/gradle-wrapper.jar ] \
            || fail "gradle-wrapper.jar uretilmedi."
          [ -f android/local.properties ] \
            || fail "android/local.properties uretilmedi."

          grep -q 'android.permission.CAMERA' "$MANIFEST" \
            || fail "AndroidManifest.xml: CAMERA izni yok."
          grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$MANIFEST" \
            || fail "AndroidManifest.xml: READ_EXTERNAL_STORAGE izni yok."
          grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' "$MANIFEST" \
            || fail "AndroidManifest.xml: WRITE_EXTERNAL_STORAGE izni yok."
          grep -q 'android.permission.READ_MEDIA_IMAGES' "$MANIFEST" \
            || fail "AndroidManifest.xml: READ_MEDIA_IMAGES izni yok."

          grep -q 'com.eokul.fotograf' android/app/build.gradle \
            || fail "android/app/build.gradle ezilmis: namespace kaybolmus."
          grep -q 'name: eokul_fotograf' pubspec.yaml \
            || fail "pubspec.yaml ezilmis: paket adi degismis."
          [ -f lib/screens/camera_screen.dart ] \
            || fail "lib/ ezilmis: camera_screen.dart kaybolmus."
          [ -f android/app/src/main/kotlin/com/eokul/fotograf/MainActivity.kt ] \
            || fail "MainActivity.kt eksik."

          echo "Tum kritik dosyalar dogrulandi."

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Uyarilar build'i durdurmasin; derleme hatalari sonraki adimda cikar.
        run: flutter analyze || true

      - name: Run tests
        run: flutter test || true

      - name: Configure signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eokul-fotograf-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
