name: Build Release APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Imzalama anahtari tanimliysa otomatik kullanilir (Settings -> Secrets).
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

  MANIFEST: android/app/src/main/AndroidManifest.xml

jobs:
  build:
    name: Flutter Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # camera 0.10.x / permission_handler 12.x / share_plus 12.x ile uyumlu.
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ---------------------------------------------------------------------
      # 1) Eksik Android iskeletini CI uzerinde uret.
      #
      #    --project-name, pubspec.yaml'daki `name:` ile AYNI olmali.
      #
      #    NOT: Flutter 3.35 Kotlin DSL uretir (build.gradle.kts). Asagida
      #    bunlar silinip yerine Groovy dosyalari yazilir. Bu yuzden bu adim
      #    yalnizca gradlew / wrapper JAR / local.properties / ikon uretmek
      #    icin gerekli.
      # ---------------------------------------------------------------------
      - name: Generate Android scaffold
        run: |
          flutter create . \
            --org com.eokul \
            --project-name eokul_fotograf \
            --platforms=android

      # ---------------------------------------------------------------------
      # 2) Git'ten gelen dosyalari geri yukle (varsa faydali, yoksa zararsiz).
      # ---------------------------------------------------------------------
      - name: Restore hand-written sources
        run: |
          git checkout -- . || true
          rm -f test/widget_test.dart
          rm -f lib/main.dart.bak pubspec.yaml.bak
          echo "Geri yukleme tamamlandi."

      # ---------------------------------------------------------------------
      # 3) GRADLE DOSYALARI  <-- kritik
      #
      #    `flutter create` Kotlin DSL uretir; bizim uygulama Groovy kullanir.
      #    Repoda android/app/build.gradle commit'li olmadigi icin KTS
      #    dosyalarini silmek geriye HICBIR build dosyasi birakmiyordu
      #    ("No such file or directory" hatasinin nedeni).
      #
      #    Bu adim dort dosyayi kosulsuz olarak yazar: deterministik ve
      #    git durumundan bagimsiz.
      # ---------------------------------------------------------------------
      - name: Ensure Android Gradle files
        run: |
          set -eu

          # Kotlin DSL dosyalarini kaldir (Groovy ile cakisir).
          find android -name "*.kts" -delete

          mkdir -p android/app

          # ------------------------- android/gradle.properties -------------
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=2048M -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF

          # ------------------------- android/settings.gradle ---------------
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.9.1" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }

          include ":app"
          EOF

          # ------------------------- android/build.gradle -------------------
          cat > android/build.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"

          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          // AGP 8 "Namespace not specified" korumasi: camera_android gibi
          // eski eklentiler namespace tanimlamaz; manifest'teki `package`
          // degerinden turetiyoruz.
          subprojects { subproject ->
              afterEvaluate {
                  try {
                      if (!subproject.hasProperty("android")) return
                      def androidExt = subproject.android
                      if (androidExt.namespace != null) return

                      def manifest = subproject.file("src/main/AndroidManifest.xml")
                      if (!manifest.exists()) return

                      def matcher = manifest.text =~ /package="([^"]+)"/
                      if (matcher.find()) {
                          androidExt.namespace = matcher.group(1)
                          println "namespace atandi: ${subproject.name} -> ${matcher.group(1)}"
                      }
                  } catch (Exception e) {
                      // Sessizce gec.
                  }
              }
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # ------------------------- android/app/build.gradle ---------------
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file("local.properties")
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader("UTF-8") { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
          if (flutterVersionCode == null) {
              flutterVersionCode = "1"
          }

          def flutterVersionName = localProperties.getProperty("flutter.versionName")
          if (flutterVersionName == null) {
              flutterVersionName = "1.0"
          }

          android {
              namespace = "com.eokul.fotograf"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              sourceSets {
                  main.java.srcDirs += "src/main/kotlin"
              }

              defaultConfig {
                  applicationId = "com.eokul.fotograf"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = flutterVersionCode.toInteger()
                  versionName = flutterVersionName
                  multiDexEnabled = true
              }

              signingConfigs {
                  def keystorePropertiesFile = rootProject.file("key.properties")
                  if (keystorePropertiesFile.exists()) {
                      def keystoreProperties = new Properties()
                      keystorePropertiesFile.withReader("UTF-8") { reader ->
                          keystoreProperties.load(reader)
                      }
                      release {
                          keyAlias = keystoreProperties["keyAlias"]
                          keyPassword = keystoreProperties["keyPassword"]
                          storeFile = file(keystoreProperties["storeFile"])
                          storePassword = keystoreProperties["storePassword"]
                      }
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.findByName("release") != null
                              ? signingConfigs.release
                              : signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }

              packagingOptions {
                  resources {
                      excludes += ["META-INF/*.kotlin_module"]
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          echo "Gradle dosyalari yazildi:"
          ls -la android/*.gradle android/app/*.gradle android/gradle.properties

      # ---------------------------------------------------------------------
      # 4) IZIN ENJEKSIYONU
      #
      #    Manifest icinde eksik olan CAMERA / depolama izinleri ve kamera
      #    donanim ozellikleri dogrudan yazilir. Idempotent.
      # ---------------------------------------------------------------------
      - name: Ensure Android permissions in manifest
        run: |
          # NOT: `set -e` BILEREK yok: asagidaki `grep -q` cagrilarinin
          # "bulunamadi" (exit 1) sonucu normal akistir.
          set -u

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST bulunamadi. Scaffold uretimi basarisiz."
            exit 1
          fi

          BLOCK=$(mktemp)
          {
            echo '    <!-- e-Okul Vesikalik: zorunlu izinler (CI tarafindan enjekte edildi) -->'
            grep -q 'android.permission.CAMERA' "$MANIFEST" \
              || echo '    <uses-permission android:name="android.permission.CAMERA" />'
            grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$MANIFEST" \
              || echo '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
            grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' "$MANIFEST" \
              || echo '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />'
            grep -q 'android.permission.READ_MEDIA_IMAGES' "$MANIFEST" \
              || echo '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />'
            echo ''
            grep -q 'android.hardware.camera"' "$MANIFEST" \
              || echo '    <uses-feature android:name="android.hardware.camera" android:required="true" />'
            grep -q 'android.hardware.camera.autofocus' "$MANIFEST" \
              || echo '    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />'
            grep -q 'android.hardware.camera.flash' "$MANIFEST" \
              || echo '    <uses-feature android:name="android.hardware.camera.flash" android:required="false" />'
          } > "$BLOCK"

          if grep -qE '<uses-permission|<uses-feature' "$BLOCK"; then
            awk -v bf="$BLOCK" '
              /<application/ && !done {
                while ((getline l < bf) > 0) print l
                close(bf)
                done = 1
              }
              { print }
            ' "$MANIFEST" > "${MANIFEST}.tmp"

            if [ -s "${MANIFEST}.tmp" ]; then
              mv "${MANIFEST}.tmp" "$MANIFEST"
              echo "Izinler manifest'e eklendi."
            else
              echo "::error::Manifest enjeksiyonu bos dosya uretti."
              rm -f "${MANIFEST}.tmp"
              exit 1
            fi
          else
            echo "Izinler zaten mevcut."
          fi
          rm -f "$BLOCK"

          # Uygulama etiketi (UTF-8 icin python; sed yerel ayara takilabilir).
          python3 - "$MANIFEST" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          t = p.read_text(encoding="utf-8")
          t2 = re.sub(r'android:label="[^"]*"', 'android:label="e-Okul Vesikalık"', t, count=1)
          if t2 != t:
              p.write_text(t2, encoding="utf-8")
              print("Manifest etiketi guncellendi.")
          PY

          echo "--- Manifest izin satirlari ---"
          grep -nE 'uses-permission|uses-feature' "$MANIFEST" || true

      # ---------------------------------------------------------------------
      # 5) MainActivity emniyet kemeri.
      # ---------------------------------------------------------------------
      - name: Ensure MainActivity
        run: |
          set -eu
          ACTIVITY=android/app/src/main/kotlin/com/eokul/fotograf/MainActivity.kt
          if [ ! -f "$ACTIVITY" ]; then
            echo "::warning::$ACTIVITY bulunamadi, yeniden olusturuluyor."
            mkdir -p "$(dirname "$ACTIVITY")"
            printf 'package com.eokul.fotograf\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity : FlutterActivity()\n' > "$ACTIVITY"
          fi
          echo "MainActivity hazir: $ACTIVITY"

      # ---------------------------------------------------------------------
      # 6) Dogrulama
      # ---------------------------------------------------------------------
      - name: Verify hand-written sources
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }

          [ -f android/gradlew ] || fail "android/gradlew uretilmedi."
          [ -f android/gradle/wrapper/gradle-wrapper.jar ] || fail "gradle-wrapper.jar uretilmedi."
          [ -f android/local.properties ] || fail "android/local.properties uretilmedi."

          [ -f android/settings.gradle ] || fail "android/settings.gradle yok."
          [ -f android/build.gradle ] || fail "android/build.gradle yok."
          [ -f android/app/build.gradle ] || fail "android/app/build.gradle yok."

          grep -q 'android.permission.CAMERA' "$MANIFEST" || fail "Manifest: CAMERA izni yok."
          grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$MANIFEST" || fail "Manifest: READ_EXTERNAL_STORAGE yok."
          grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' "$MANIFEST" || fail "Manifest: WRITE_EXTERNAL_STORAGE yok."
          grep -q 'android.permission.READ_MEDIA_IMAGES' "$MANIFEST" || fail "Manifest: READ_MEDIA_IMAGES yok."

          grep -q 'com.eokul.fotograf' android/app/build.gradle || fail "app/build.gradle: namespace kaybolmus."
          grep -q 'name: eokul_fotograf' pubspec.yaml || fail "pubspec.yaml ezilmis."
          [ -f lib/screens/camera_screen.dart ] || fail "lib/ ezilmis."
          [ -f android/app/src/main/kotlin/com/eokul/fotograf/MainActivity.kt ] || fail "MainActivity.kt eksik."

          echo "Tum kritik dosyalar dogrulandi."

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Run tests
        run: flutter test || true

      - name: Configure signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eokul-fotograf-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
